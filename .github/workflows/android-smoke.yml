name: Android Smoke Test (emulator)

# Boots real Android emulators, installs the signed APK and verifies that
#   * the app starts and stays in the foreground,
#   * the bundled shell really loads (the WebView must not report
#     ERR_CONNECTION_REFUSED — that would mean the loopback server died),
#   * the hardware back button does not crash the app.
#
# Covers the Android versions the customers actually use: 8.0, 10, 12, 14.
# Kept separate from the release workflow so a flaky emulator can never block
# a release build. Run it manually from the Actions tab.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "src/lib/offline/**"
      - "src/components/OfflineBar.tsx"
      - "index.html"
      - "scripts/patch-android.py"
      - "scripts/make-branding.py"
      - "assets/branding/**"
      - ".github/scripts/emulator-smoke.sh"
      - ".github/workflows/android-smoke.yml"

concurrency:
  group: android-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build test APK (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build front-end (dist)
        run: npm run build:frontend

      - name: Stage bundled web assets
        run: |
          set -e
          test -f dist/public/index.html
          rm -rf appdist
          mkdir -p appdist
          cp -a dist/public/. appdist/
          rm -f appdist/sw.js appdist/registerSW.js appdist/workbox-*.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK + NDK
        run: |-
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM="$(command -v sdkmanager || ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" --install "platform-tools" "platforms;android-35" \
            "build-tools;35.0.0" "ndk;27.0.12077973" >/dev/null
          echo "NDK_HOME=$SDK/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-smoke-${{ runner.os }}-${{ hashFiles('src-tauri/gen/android/**/*.gradle*') }}
          restore-keys: gradle-smoke-${{ runner.os }}-

      - name: Init + patch Android project
        run: |
          set -e
          npx tauri android init --ci
          BUILD_VERSION_CODE=$((150600 + ${{ github.run_number }})) python3 scripts/patch-android.py
          F=$(find src-tauri/gen/android/app/src/main/java -name MainActivity.kt | head -1)
          grep -qE "handleBackNavigation.*= *true" "$F" || { echo "::error::back navigation patch missing"; exit 1; }

      - name: Build x86_64 APK
        run: npx tauri android build --apk --target x86_64

      - name: Sign APK (V1 + V2 + V3)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          test -n "$KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 secret"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          BT="$ANDROID_HOME/build-tools/35.0.0"
          RAW=$(find src-tauri/gen/android/app/build/outputs/apk -name "*-unsigned.apk" | head -1)
          test -n "$RAW" || { echo "no unsigned APK produced"; find src-tauri/gen/android/app/build/outputs/apk -type f; exit 1; }
          "$BT/zipalign" -p -f 4 "$RAW" aligned.apk
          "$BT/apksigner" sign --ks release.keystore --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" \
            --min-sdk-version 24 --v1-signing-enabled true \
            --v2-signing-enabled true --v3-signing-enabled true \
            --out yasco-smoke.apk aligned.apk
          "$BT/apksigner" verify --verbose yasco-smoke.apk | head -6
          rm -f release.keystore aligned.apk
          ls -lh yasco-smoke.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk-x86_64
          path: yasco-smoke.apk
          retention-days: 7

  smoke:
    name: Android ${{ matrix.api }} emulator
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Android 8.0, 10, 12, 14
        api: [26, 29, 31, 34]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk-x86_64

      - name: Enable KVM
        run: |-
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          # google_apis images ship a working Android System WebView; the
          # bare "default" images can be missing it, which crashes the app.
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash "${{ github.workspace }}/.github/scripts/emulator-smoke.sh"