name: Android Build

# Builds a signed YASCO ERP Android APK from the bundled front-end.
# The live website / live ERP server is never contacted by this workflow:
# it only reads the repository, builds assets and produces an APK artifact.

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    # Only rebuild the APK when the app itself changes (docs, the landing page
    # or the smoke workflow must not burn a 15 minute Android build).
    paths:
      - "src/**"
      - "api/**"
      - "public/**"
      - "appdist/**"
      - "appdist-stub/**"
      - "scripts/**"
      - "src-tauri/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - "tsconfig*.json"
      - ".github/workflows/android.yml"

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build front-end (dist)
        run: npm run build:frontend

      - name: Stage bundled web assets
        run: |
          set -e
          test -f dist/public/index.html
          rm -rf appdist
          mkdir -p appdist
          cp -a dist/public/. appdist/
          # The app ships its own copy of the assets; a service worker would
          # keep serving an older bundle after an APK update.
          rm -f appdist/sw.js appdist/registerSW.js appdist/workbox-*.js
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path('appdist/index.html')
          html = p.read_text(encoding='utf-8')
          html = re.sub(r'<script[^>]*(?:registerSW|serviceWorker)[^>]*>\s*</script>', '', html, flags=re.I)
          p.write_text(html, encoding='utf-8')
          PY
          echo "staged files: $(find appdist -type f | wc -l), size: $(du -sh appdist | cut -f1)"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The hosted runner already ships the Android SDK; installing packages
      # directly avoids the broken `sdkmanager tools` call in setup-android.
      - name: Install Android NDK + SDK packages
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM="$(command -v sdkmanager || true)"
          if [ -z "$SDKM" ]; then
            SDKM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          fi
          test -x "$SDKM" || { echo "sdkmanager not found"; ls -la "$SDK"; exit 1; }
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" --install \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" >/dev/null
          echo "NDK_HOME=$SDK/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/27.0.12077973" >> "$GITHUB_ENV"
          ls "$SDK/ndk"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('src-tauri/gen/android/**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Init Android project
        run: npx tauri android init --ci

      - name: Patch Android project (manifest + back button)
        run: python3 scripts/patch-android.py

      - name: Build APK (arm64)
        run: npx tauri android build --apk --target aarch64

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          test -n "$KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 secret"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          BT="$ANDROID_HOME/build-tools/35.0.0"
          RAW=$(find src-tauri/gen/android/app/build/outputs/apk -name "*-unsigned.apk" | head -1)
          test -n "$RAW" || { echo "No unsigned APK produced"; find src-tauri/gen/android/app/build/outputs/apk -type f; exit 1; }
          echo "unsigned: $RAW"
          "$BT/zipalign" -p -f 4 "$RAW" aligned.apk
          "$BT/apksigner" sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "YASCO-ERP-${{ github.run_number }}.apk" aligned.apk
          "$BT/apksigner" verify --print-certs "YASCO-ERP-${{ github.run_number }}.apk" | head -5
          rm -f release.keystore aligned.apk
          # Stable name for the public download URL
          # (/releases/latest/download/YASCO-ERP.apk and yasco.tech/YASCO-ERP.apk)
          cp "YASCO-ERP-${{ github.run_number }}.apk" YASCO-ERP.apk
          ls -lh "YASCO-ERP-${{ github.run_number }}.apk" YASCO-ERP.apk

      # Actions artifact storage quota par depend nahi karta: APK seedha
      # GitHub Release me publish hota hai (private repo, login ke saath).
      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: YASCO ERP Android — build ${{ github.run_number }}
          body: |
            Bundled offline-first Android build (arm64).

            - Commit: `${{ github.sha }}`
            - Version: 15.6.1 (versionCode 150601)
            - Signed with the YASCO release key

            Download the `.apk` below and install it on the phone
            (allow "Install unknown apps" for the browser/file manager).
          files: YASCO-ERP-*.apk
          fail_on_unmatched_files: true

      # Public download home. The landing page links to
      #   <public repo>/releases/latest/download/YASCO-ERP.apk
      # so it always serves the newest build without any page edit.
      - name: Publish public download
        uses: softprops/action-gh-release@v2
        with:
          repository: sastishoppingstore/yasco-erp-download
          token: ${{ secrets.DOWNLOAD_REPO_TOKEN }}
          tag_name: v1.0.${{ github.run_number }}
          name: YASCO ERP Android — build ${{ github.run_number }}
          make_latest: true
          body: |
            Bundled ERP for Android (arm64, signed).

            - Version 15.6.1 (versionCode 150601) — build ${{ github.run_number }}
            - Commit: ${{ github.sha }}
            - Offline: app shell, cached reads **and** queued writes
            - Direct link: https://github.com/sastishoppingstore/yasco-erp-download/releases/latest/download/YASCO-ERP.apk
          files: YASCO-ERP.apk
          fail_on_unmatched_files: true

      # Mirror the APK to the VPS as well, so customers can download it from
      # https://yasco.tech/YASCO-ERP.apk (no GitHub redirect). Same restricted
      # deploy key as the landing page: it can only write that one file.
      - name: Mirror APK to yasco.tech
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          test -n "$VPS_SSH_KEY" || { echo "Missing VPS_SSH_KEY secret"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 203.161.63.59 >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -T -o StrictHostKeyChecking=yes root@203.161.63.59 deploy-apk \
            < "YASCO-ERP-${{ github.run_number }}.apk"
          sleep 2
          curl -sI --max-time 60 https://yasco.tech/YASCO-ERP.apk | head -4
