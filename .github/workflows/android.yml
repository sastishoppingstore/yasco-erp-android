name: Android Build

# Builds a signed YASCO ERP Android APK from the bundled front-end.
# The live website / live ERP server is never contacted by this workflow:
# it only reads the repository, builds assets and produces an APK.

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    # Only rebuild the APK when the app itself changes (docs, the landing page
    # or the smoke workflow must not burn a 15 minute Android build).
    paths:
      - "src/**"
      - "api/**"
      - "public/**"
      - "appdist/**"
      - "appdist-stub/**"
      - "scripts/**"
      - "assets/**"
      - "src-tauri/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - "tsconfig*.json"
      - ".github/workflows/android.yml"

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build front-end (dist)
        run: npm run build:frontend

      - name: Stage bundled web assets
        run: |
          set -e
          test -f dist/public/index.html
          rm -rf appdist
          mkdir -p appdist
          cp -a dist/public/. appdist/
          # The app ships its own copy of the assets; a service worker would
          # keep serving an older bundle after an APK update.
          rm -f appdist/sw.js appdist/registerSW.js appdist/workbox-*.js
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path('appdist/index.html')
          html = p.read_text(encoding='utf-8')
          html = re.sub(r'<script[^>]*(?:registerSW|serviceWorker)[^>]*>\s*</script>', '', html, flags=re.I)
          p.write_text(html, encoding='utf-8')
          PY
          echo "staged files: $(find appdist -type f | wc -l), size: $(du -sh appdist | cut -f1)"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The hosted runner already ships the Android SDK; installing packages
      # directly avoids the broken `sdkmanager tools` call in setup-android.
      - name: Install Android NDK + SDK packages
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM="$(command -v sdkmanager || true)"
          if [ -z "$SDKM" ]; then
            SDKM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          fi
          test -x "$SDKM" || { echo "sdkmanager not found"; ls -la "$SDK"; exit 1; }
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" >/dev/null
          echo "NDK_HOME=$SDK/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/27.0.12077973" >> "$GITHUB_ENV"
          ls "$SDK/ndk"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Only the phone ABIs are built (the x86 targets were emulator-only).
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('src-tauri/gen/android/**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      # versionCode must grow on every build, otherwise Android refuses the
      # update with "package appears to be invalid" / "app not installed".
      - name: Set build identity
        run: |
          set -e
          VC=$((150600 + ${{ github.run_number }}))
          echo "VERSION_CODE=$VC" >> "$GITHUB_ENV"
          echo "VERSION_NAME=15.6.1" >> "$GITHUB_ENV"
          echo "APK_FILE=YASCO-ERP-$VC.apk" >> "$GITHUB_ENV"
          # Written before `android init` so the generated Gradle project gets
          # the value through Tauri itself (the patch script also enforces it).
          VC="$VC" python3 - <<'PY'
          import json, os, pathlib
          p = pathlib.Path("src-tauri/tauri.android.conf.json")
          cfg = json.loads(p.read_text(encoding="utf-8"))
          android = cfg.setdefault("bundle", {}).setdefault("android", {})
          android["versionCode"] = int(os.environ["VC"])
          android["minSdkVersion"] = 24
          p.write_text(json.dumps(cfg, indent=2) + "\n", encoding="utf-8")
          print("tauri.android.conf.json:", android)
          PY
          echo "build ${{ github.run_number }} -> versionCode $VC"

      - name: Init Android project
        run: npx tauri android init --ci

      - name: Patch Android project (manifest, SDK levels, splash, back button)
        run: python3 scripts/patch-android.py

      # One universal APK for real phones: arm64-v8a (all modern devices) and
      # armeabi-v7a (32-bit phones, incl. most Android Go hardware). The x86
      # libraries are emulator-only and used to add ~60 MB to every download,
      # which is what made the file fail to finish downloading on a phone.
      - name: Build universal APK (ARM phones)
        run: npx tauri android build --apk --target aarch64 armv7

      - name: Sign APK (V1 + V2 + V3)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          test -n "$KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 secret"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          BT="$ANDROID_HOME/build-tools/35.0.0"

          # Prefer the universal output; a per-ABI output would only run on one
          # kind of phone.
          RAW=$(find src-tauri/gen/android/app/build/outputs/apk -path "*universal*" -name "*-unsigned.apk" | head -1)
          [ -n "$RAW" ] || RAW=$(find src-tauri/gen/android/app/build/outputs/apk -name "*-unsigned.apk" | head -1)
          test -n "$RAW" || { echo "No unsigned APK produced"; find src-tauri/gen/android/app/build/outputs/apk -type f; exit 1; }
          echo "unsigned: $RAW"

          "$BT/zipalign" -p -f 4 "$RAW" aligned.apk
          "$BT/apksigner" sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --min-sdk-version 24 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$APK_FILE" aligned.apk

          rm -f release.keystore aligned.apk
          # Stable name for the public download URL
          # (/releases/latest/download/YASCO-ERP.apk and yasco.tech/YASCO-ERP.apk)
          cp "$APK_FILE" YASCO-ERP.apk
          ls -lh "$APK_FILE" YASCO-ERP.apk

      - name: Verify APK (signature, SDK levels, ABIs, checksum)
        run: |
          set -e
          BT="$ANDROID_HOME/build-tools/35.0.0"
          APK=YASCO-ERP.apk

          echo "=== signature ==="
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee signature.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" signature.txt || { echo "::error::V2 signature missing"; exit 1; }
          grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" signature.txt || { echo "::error::V3 signature missing"; exit 1; }

          # apksigner only checks the schemes that the APK's own minSdk can
          # read, so v1 is reported as false for minSdk 24 even when the JAR
          # signature is present. Verify it explicitly for API 23 and check
          # that the JAR signature files really exist in the archive.
          "$BT/apksigner" verify --min-sdk-version 23 --verbose "$APK" | tee signature-v1.txt
          grep -q "Verified using v1 scheme (JAR signing): true" signature-v1.txt || { echo "::error::V1 signature missing"; exit 1; }
          unzip -l "$APK" | grep -E "META-INF/(MANIFEST.MF|YASCO\.(SF|RSA))" || { echo "::error::V1 signature files missing from the APK"; exit 1; }

          echo "=== badging ==="
          AAPT="$BT/aapt"
          [ -x "$AAPT" ] || AAPT="$BT/aapt2"
          "$AAPT" dump badging "$APK" | tee badging.txt | head -12
          grep -q "package: name='com.yasco.erp'" badging.txt
          grep -q "sdkVersion:'24'" badging.txt || { echo "::error::minSdk is not 24"; exit 1; }
          grep -q "targetSdkVersion:'35'" badging.txt || { echo "::error::targetSdk is not 35"; exit 1; }
          grep -q "versionCode='$VERSION_CODE'" badging.txt || { echo "::error::unexpected versionCode"; exit 1; }

          echo "=== ABIs ==="
          NATIVE=$(grep "native-code:" badging.txt)
          echo "$NATIVE"
          for abi in arm64-v8a armeabi-v7a; do
            echo "$NATIVE" | grep -q "'$abi'" || { echo "::error::missing ABI $abi"; exit 1; }
          done
          # 32-bit phones (Android Go) must never be left without a native lib.
          echo "$NATIVE" | grep -q "'armeabi-v7a'" || { echo "::error::no 32-bit support"; exit 1; }

          echo "=== permission ==="
          grep -q "uses-permission: name='android.permission.INTERNET'" badging.txt

          echo "=== checksum ==="
          sha256sum "$APK" | tee checksum.txt
          # Sidecar file so the download can be checked on the phone / PC.
          cp checksum.txt SHA256.txt
          echo "SHA256=$(cut -d' ' -f1 checksum.txt)" >> "$GITHUB_ENV"

      # Actions artifact storage quota par depend nahi karta: APK seedha
      # GitHub Release me publish hota hai (private repo, login ke saath).
      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: YASCO ERP Android — build ${{ github.run_number }}
          body: |
            Universal signed Android build.

            - versionCode: `${{ env.VERSION_CODE }}` (build ${{ github.run_number }})
            - minSdk 24 (Android 7.0) · targetSdk 35
            - ABIs: arm64-v8a, armeabi-v7a (phones)
            - Signature: V1 + V2 + V3 (YASCO release key)
            - SHA-256: `${{ env.SHA256 }}`
            - Commit: `${{ github.sha }}`
          files: |
            YASCO-ERP.apk
            YASCO-ERP-*.apk
            checksum.txt
            SHA256.txt
          fail_on_unmatched_files: true

      # Public download home. The landing page links to
      #   <public repo>/releases/latest/download/YASCO-ERP.apk
      # so it always serves the newest build without any page edit.
      - name: Publish public download
        uses: softprops/action-gh-release@v2
        with:
          repository: sastishoppingstore/yasco-erp-download
          token: ${{ secrets.DOWNLOAD_REPO_TOKEN }}
          tag_name: v1.0.${{ github.run_number }}
          name: YASCO ERP Android — build ${{ github.run_number }}
          make_latest: true
          body: |
            Signed APK for Android 7.0+ phones (including Android Go).

            - versionCode `${{ env.VERSION_CODE }}` · version 15.6.1
            - ABIs: arm64-v8a + armeabi-v7a (64-bit and 32-bit phones)
            - V1 + V2 + V3 signatures
            - SHA-256: `${{ env.SHA256 }}`
            - Stable link: https://github.com/sastishoppingstore/yasco-erp-download/releases/latest/download/YASCO-ERP.apk
            - If an older YASCO app is installed, uninstall it first (different
              signing key would block the update).
          files: |
            YASCO-ERP.apk
            YASCO-ERP-*.apk
            SHA256.txt
          fail_on_unmatched_files: true

      # A truncated upload is the classic cause of "package appears to be
      # invalid" on the phone, so the published asset is downloaded again and
      # compared byte for byte with the file that was just verified.
      - name: Verify published download
        run: |
          set -e
          for i in 1 2 3 4 5; do
            if curl -fsSL --max-time 300 -o published.apk \
              "https://github.com/sastishoppingstore/yasco-erp-download/releases/download/v1.0.${{ github.run_number }}/YASCO-ERP.apk"; then
              break
            fi
            sleep 10
          done
          test -s published.apk || { echo "::error::public download not reachable"; exit 1; }
          LOCAL=$(sha256sum YASCO-ERP.apk | cut -d' ' -f1)
          REMOTE=$(sha256sum published.apk | cut -d' ' -f1)
          echo "local:  $LOCAL"
          echo "remote: $REMOTE"
          [ "$LOCAL" = "$REMOTE" ] || { echo "::error::published APK differs (truncated upload?)"; exit 1; }
          ls -l published.apk

      # Mirror the APK to the VPS as well, so customers can download it from
      # https://yasco.tech/YASCO-ERP.apk (no GitHub redirect). Same restricted
      # deploy key as the landing page: it can only write that one file.
      - name: Mirror APK to yasco.tech
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          test -n "$VPS_SSH_KEY" || { echo "Missing VPS_SSH_KEY secret"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 203.161.63.59 >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -T -o StrictHostKeyChecking=yes root@203.161.63.59 deploy-apk \
            < YASCO-ERP.apk
          sleep 2
          curl -sI --max-time 60 "https://yasco.tech/YASCO-ERP.apk?v=${{ env.VERSION_CODE }}" | head -4
          # Cache-busted download must match the verified checksum exactly.
          curl -fsSL --max-time 300 -o mirror.apk \
            "https://yasco.tech/YASCO-ERP.apk?v=${{ env.VERSION_CODE }}"
          [ "$(sha256sum mirror.apk | cut -d' ' -f1)" = "$SHA256" ] \
            || { echo "::error::mirror differs from the signed APK"; exit 1; }
          ls -l mirror.apk