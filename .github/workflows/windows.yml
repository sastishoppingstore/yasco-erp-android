name: Windows Desktop Build

# Builds the standalone YASCO ERP for Windows from THIS repository (no manual
# build on the VPS or locally). The installer embeds the entire front-end
# (`dist/public`) plus a tiny Node sidecar that only serves the static UI and
# reverse-proxies `/api/*` to the live backend, so:
#   * the UI is bundled locally and opens instantly,
#   * the app starts at /login (never the marketing landing page),
#   * every read/write goes to the live server (full parity and the exact same
#     per-module routing/isolation as the website), and
#   * there is no local database, offline cache or background sync.
#
# This workflow ONLY builds and publishes build artifacts (upload-artifact +
# GitHub release). It deliberately does NOT upload to the VPS: the stable
# installer already published at https://yasco.tech/YASCO-ERP.exe is left
# untouched. To publish a new build, run the deploy step manually.

on:
  workflow_dispatch:
  push:
    branches: [zatca-phase2, new3, main, master]
    paths:
      - "src/**"
      - "api/**"
      - "desktop/**"
      - "src-tauri/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - "tsconfig*.json"
      - ".github/workflows/windows.yml"

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Stage Node sidecar (offline backend runtime)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item (Get-Command node).Source src-tauri/binaries/node-x86_64-pc-windows-msvc.exe -Force

      - name: Build front-end + sidecar + Tauri app
        # `tauri build` runs beforeBuildCommand = `npm run build && npm run build:desktop`.
        run: npx tauri build --bundles nsis
        env:
          NODE_ENV: production
          NODE_OPTIONS: "--max-old-space-size=4096"
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Verify bundled output
        shell: bash
        run: |
          set -e
          test -f dist/public/index.html
          test -f dist/desktop-boot.js
          ls -la dist/public/index.html dist/desktop-boot.js
          ls -la src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: yasco-erp-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-build-${{ github.run_number }}
          name: YASCO ERP Windows — build ${{ github.run_number }}
          files: src-tauri/target/release/bundle/nsis/*.exe
          body: |
            Standalone YASCO ERP for Windows (v${{ github.run_number }}).

            - Front-end bundled locally — the app opens instantly from disk.
            - Opens straight at the login screen (no marketing page).
            - Same accounts/modules as the website: each user only sees their own
              module (travel / construction / Sahl / workshop) — enforced server-side.
            - Thin client of the live server: all data is read from and written to
              the live backend. No local database or offline cache.

            NOTE: this build is published as a GitHub artifact/release only. The
            installer served at https://yasco.tech/YASCO-ERP.exe is the stable
            release and is intentionally left unchanged by this workflow.
