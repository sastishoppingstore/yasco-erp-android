[package]
name = "app"
version = "15.6.1"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-store = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"

# Desktop-only: POS printing, serial ports, hardware fingerprint.
[target.'cfg(desktop)'.dependencies]
escpos = "0.4"
machine-uid = "0.5"
sysinfo = "0.33"
sha2 = "0.10"
serialport = "4.3"
hex = "0.4"

# Android-only: loopback web server that serves the bundled front-end and
# proxies /api to the hosted ERP.
[target.'cfg(target_os = "android")'.dependencies]
tiny_http = "0.12"
ureq = { version = "2.12", features = ["tls"] }
include_dir = "0.7"
mime_guess = "2"
